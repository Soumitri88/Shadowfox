<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Appointment</title>
    <link rel="stylesheet" href="style.css"
</head>

<body>

    <h1 class="emergency">Emergency Appointment</h1>

    <p>Please fill in the details for emergency medical assistance.</p>

    <form class="emergency-form">
        <label>Name:</label>
        <input type="text" required>

        <br><br>

        <label>Phone:</label>
        <input type="tel" required>

        <br><br>

        <label>Emergency Details:</label>
        <textarea required></textarea>

        <br><br>

        <button type="submit">Submit Emergency Request</button>
    </form>

</body>
</html>
